name: Update profile

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/profile.ts"
      - "data/photos.ts"
      - "assets/photos/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the write token out of .git/config so dependency install scripts can't read it.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - run: pnpm install --frozen-lockfile

      # The contribution calendar already includes private contributions (the profile
      # shares them). Optional secret PROFILE_TOKEN (a PAT of the profile owner) also
      # counts private-repo commits/PRs/reviews in the HISTOGRAM panel.
      - name: Refresh snapshots
        run: just snapshot
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - run: just build
      - run: just check
        env:
          # One private term per line; tests report entry numbers only, never the terms.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add README.md assets/generated data/snapshot
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
